# Runs on every PR: typecheck, lint, tests. Docs: https://docs.expo.dev/eas/workflows/get-started/
name: CI

on:
  pull_request:
    branches: ['*']

jobs:
  check:
    name: Typecheck, lint, test
    type: custom
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --ci
