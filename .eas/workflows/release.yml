# Production release: OTA update when only JS changed, otherwise cloud store builds + submit.
# Uses the fingerprint to decide. Docs: https://docs.expo.dev/eas/workflows/examples/deploy-to-production/
#
# Manual only, because cloud builds use the EAS plan quota:
#   eas workflow:run .eas/workflows/release.yml
name: Release

on:
  workflow_dispatch: {}

jobs:
  fingerprint:
    type: fingerprint
  get_ios_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: production
  get_android_build:
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: production
  build_ios:
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params: { platform: ios, profile: production }
  build_android:
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params: { platform: android, profile: production }
  submit_ios:
    needs: [build_ios]
    type: submit
    params: { build_id: '${{ needs.build_ios.outputs.build_id }}' }
  submit_android:
    needs: [build_android]
    type: submit
    params: { build_id: '${{ needs.build_android.outputs.build_id }}' }
  update:
    needs: [get_ios_build, get_android_build]
    if: ${{ needs.get_ios_build.outputs.build_id && needs.get_android_build.outputs.build_id }}
    type: update
    env: { APP_VARIANT: production, EXPO_PUBLIC_API_MOCK: 'false' }
    params: { channel: production }
