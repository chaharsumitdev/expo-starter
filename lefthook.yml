pre-commit:
  parallel: true
  commands:
    prettier:
      glob: '*.{js,ts,tsx,json,css,md}'
      run: pnpm prettier --write {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,ts,tsx}'
      run: pnpm eslint --fix {staged_files}
      stage_fixed: true
    typecheck:
      glob: '*.{ts,tsx}'
      run: pnpm typecheck
